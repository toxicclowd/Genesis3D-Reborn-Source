; Settings for the Genesis3D: Reborn DirectX 12 driver (Direct3D12Driver.dll).
;
; Every setting can also be set with an environment variable named G3D_D3D12_<KEY>,
; for example G3D_D3D12_WARP=1. The environment variable wins over this file.

[Debug]
; Enable the D3D12 debug layer (needs the "Graphics Tools" Windows optional feature).
; Default: 1 in Debug builds, 0 in Release builds.
;DebugLayer=1
; GPU-based validation. Much slower; only takes effect with the debug layer on.
;GPUValidation=0

[Device]
; Render on WARP, the software rasterizer. Slow, but gives the same image on every
; machine, which is what the render regression in CI needs.
;Warp=0

[Shaders]
; Compile the embedded HLSL at startup (SM 5.0) instead of using the DXIL built
; with the driver. Mainly for testing the fallback path.
;RuntimeCompile=0
; Folder of .hlsl files to compile at startup, relative to this file or absolute.
; Point it at Renderer\Direct3D12\Shaders to iterate on shaders without rebuilding.
; A file that fails to compile falls back to the built-in shader and logs the error.
;SourceDir=..\Renderer\Direct3D12\Shaders

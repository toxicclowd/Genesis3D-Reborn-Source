; Settings for the Genesis3D: Reborn DirectX 12 driver (Direct3D12Driver.dll).
;
; Every setting can also be set with an environment variable named G3D_D3D12_<KEY>,
; for example G3D_D3D12_WARP=1. The environment variable wins over this file.

[Debug]
; Enable the D3D12 debug layer (needs the "Graphics Tools" Windows optional feature).
; Default: 1 in Debug builds, 0 in Release builds.
;DebugLayer=1
; GPU-based validation. Much slower; only takes effect with the debug layer on.
;GPUValidation=0

[Device]
; Render on WARP, the software rasterizer. Slow, but gives the same image on every
; machine, which is what the render regression in CI needs.
;Warp=0

[Render]
; Draw the scene into an HDR (R16G16B16A16_FLOAT) target and copy it to the back
; buffer in a final present pass. 0 draws straight to the back buffer as before.
;SceneTarget=1
; Pixel shaders read textures straight from the descriptor heap by index (needs
; resource binding tier 2; tier 1 hardware always uses per-draw descriptor tables).
;Bindless=1

[Shaders]
; Compile the embedded HLSL at startup (SM 5.0) instead of using the DXIL built
; with the driver. Mainly for testing the fallback path.
;RuntimeCompile=0
; Folder of .hlsl files to compile at startup, relative to this file or absolute.
; Point it at Renderer\Direct3D12\Shaders to iterate on shaders without rebuilding.
; A file that fails to compile falls back to the built-in shader and logs the error.
;SourceDir=..\Renderer\Direct3D12\Shaders

[Look]
; The Look Profile (roadmap Phase 3): Classic, Enhanced or Stylized. Applications and
; the World Editor (3D view's right-click menu > Look) can change it at run time.
;   Classic  - draws like the original engine: gamma-space lighting, no post-processing.
;   Enhanced - HDR lighting, per-pixel dynamic lights, real-time shadows for dynamic
;              lights that cast them, tonemapping, auto exposure, bloom, fog, SSAO.
;   Stylized - Enhanced plus the retro options below (render scale, palette, dither...).
;Profile=Classic
; ACES or AgX (or None).
;Tonemapper=ACES
; Adapt to the scene's brightness; ExposureEV is then added as compensation. With
; AutoExposure=0 ExposureEV is the exposure (0 = as drawn).
;AutoExposure=1
;ExposureEV=0
;AutoExposureMinEV=-3
;AutoExposureMaxEV=2
; Scene luminance auto exposure aims for (mid grey).
;AutoExposureKey=0.18
;Bloom=1
;BloomIntensity=0.05
; Ambient occlusion from the depth buffer.
;SSAO=0
;SSAORadius=48
;SSAOIntensity=0.6
; Real-time shadows for dynamic lights that cast them (see [Shadows]).
;Shadows=1
; Height fog: density at HeightFogBase, thinning by HeightFogFalloff per unit above it.
; 0 = off. The engine's distance fog (grEngine_SetFog) works in every profile.
;HeightFogDensity=0
;HeightFogBase=0
;HeightFogFalloff=0.002
;HeightFogRed=0.5
;HeightFogGreen=0.55
;HeightFogBlue=0.6
; Stylized only: scene resolution relative to the window (nearest-neighbour upscale),
; bits per color channel (0 = full color), ordered dither, CRT scanlines, the screen
; grid width vertices snap to (0 = off, e.g. 320), and dynamic lights shading each
; lightmap texel as one (blocky where the lightmaps are coarse).
;RenderScale=0.5
;PaletteBits=5
;Dither=1
;CRT=0
;VertexSnap=0
;SnapLighting=0

[Shadows]
; Shadow map atlas size in texels (split into 8 x 8 cells: a point light takes 6
; cells, a spot light 2 x 2, a directional light 4 cascades of 2 x 2).
;AtlasSize=4096
; Most dynamic lights with shadows per frame (the nearest to the camera win).
;MaxLights=8
; How far directional light shadows reach from the camera.
;Distance=3000
